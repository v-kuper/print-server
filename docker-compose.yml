name: atol

services:
  postgres:
    image: postgres:16-alpine
    container_name: atol-postgres
    environment:
      POSTGRES_DB: atol
      POSTGRES_USER: atol
      POSTGRES_PASSWORD: atol
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atol -d atol"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  atol-server:
    container_name: atol-go-server
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-plain
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://atol:atol@postgres:5432/atol?sslmode=disable"
      SETTINGS_PATH: "/data/settings.json"
      IMAGE_EDITOR_PATH: "/data/image-editor"
      ATOL_LIBRARY_PATH: "/opt/atol/lib"
      GODEBUG: "asyncpreemptoff=1"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped

volumes:
  postgres-data:
