name: Deploy Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: atol-windows-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and restart ATOL server
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 30

    env:
      ATOL_DATA_DIR: ${{ vars.ATOL_DATA_DIR }}
      PSExecutionPolicyPreference: Bypass
      TELEGRAM_FAX_ALLOWED_SENDER_IDS: ${{ vars.TELEGRAM_FAX_ALLOWED_SENDER_IDS }}
      TELEGRAM_FAX_API_BASE_URL: ${{ vars.TELEGRAM_FAX_API_BASE_URL }}
      TELEGRAM_FAX_BOT_TOKEN: ${{ secrets.TELEGRAM_FAX_BOT_TOKEN }}
      TELEGRAM_FAX_OWNER_IDS: ${{ vars.TELEGRAM_FAX_OWNER_IDS }}
      TELEGRAM_FAX_POLL_TIMEOUT_SECONDS: ${{ vars.TELEGRAM_FAX_POLL_TIMEOUT_SECONDS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false

      - name: Validate persistent data directory
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ATOL_DATA_DIR)) {
            throw "Set GitHub repository variable ATOL_DATA_DIR to the Windows path of the persistent data directory."
          }

          New-Item -ItemType Directory -Force -Path $env:ATOL_DATA_DIR | Out-Null
          $resolvedDataDir = (Resolve-Path $env:ATOL_DATA_DIR).Path
          $googleDir = Join-Path $resolvedDataDir "google"
          $imageEditorDir = Join-Path $resolvedDataDir "image-editor"
          New-Item -ItemType Directory -Force -Path $googleDir, $imageEditorDir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "ATOL_DATA_DIR=$resolvedDataDir"

          $settingsPath = Join-Path $resolvedDataDir "settings.json"
          if (-not (Test-Path $settingsPath)) {
            Write-Warning "settings.json was not found in ATOL_DATA_DIR; the server may create defaults or require initial setup."
          }

          $googleCredentialsPath = Join-Path $googleDir "credentials.json"
          if (-not (Test-Path $googleCredentialsPath)) {
            Write-Warning "Google credentials were not found at $googleCredentialsPath."
          }

      - name: Show tool versions
        shell: powershell
        run: |
          go version
          docker version
          docker compose version

      - name: Run Go tests
        shell: powershell
        run: |
          go test ./...

      - name: Set build metadata
        shell: powershell
        run: |
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=build-$env:GITHUB_RUN_NUMBER"
          Add-Content -Path $env:GITHUB_ENV -Value "APP_COMMIT=$env:GITHUB_SHA"
          Add-Content -Path $env:GITHUB_ENV -Value "APP_BRANCH=$env:GITHUB_REF_NAME"
          Add-Content -Path $env:GITHUB_ENV -Value "APP_BUILD_TIME=$buildTime"

      - name: Build Docker image
        shell: powershell
        run: |
          docker compose build atol-server

      - name: Restart Docker service
        shell: powershell
        run: |
          docker compose up -d --force-recreate atol-server

      - name: Check server health
        shell: powershell
        run: |
          $deadline = (Get-Date).AddSeconds(60)

          do {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8080/healthz" -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                $response.Content
                exit 0
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          } while ((Get-Date) -lt $deadline)

          docker compose ps
          docker compose logs --tail=120 atol-server
          throw "ATOL server did not pass health check within 60 seconds"
